name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # `tsc -b --force` — a plain `tsc --noEmit` checks nothing here, because
      # the root tsconfig is solution-style and only `-b` follows references.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Build last: it re-runs the type gate and catches bundler-only failures.
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://example.invalid
          VITE_SUPABASE_URL: https://example.invalid
          VITE_SUPABASE_ANON_KEY: ci-placeholder-key

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # playwright.config.ts's webServer.env pins the same fake-host env vars
      # vitest.config.ts uses for the unit suite — nothing to set here.
      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
