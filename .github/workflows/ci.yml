name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # `tsc -b --force` — a plain `tsc --noEmit` checks nothing here, because
      # the root tsconfig is solution-style and only `-b` follows references.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Build last: it re-runs the type gate and catches bundler-only failures.
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://example.invalid
          VITE_SUPABASE_URL: https://example.invalid
          VITE_SUPABASE_ANON_KEY: ci-placeholder-key
